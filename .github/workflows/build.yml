
name: Build HealthBridge Debug APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Patch SleepStage for Samsung SDK 1.1.0
        run: |
          sed -i '/data\.data\.SleepStage/d' app/src/main/java/com/example/bridge/SamsungSdkAdapter.kt
          sed -i 's/SleepStage\.StageType/DataType.SleepType.StageType/g' app/src/main/java/com/example/bridge/SamsungSdkAdapter.kt

      - name: Create Google Services JSON for CI
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "healthbridge-ci"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.healthbridge.kvnqrx"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIBuildOnly000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthbridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
